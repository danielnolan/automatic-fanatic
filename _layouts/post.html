---
layout: default
---

<article class="py-5">
  <div class="container">
    <header class="mb-4 pb-4 border-bottom">
      <h1>{{ page.title }}</h1>
      <p class="text-secondary">{{ page.date | date: "%B %d, %Y" }}{% if page.categories %} &bull; {{ page.categories | join: ", " }}{% endif %}</p>
    </header>

    <div class="content" style="max-width: 800px;">
      {{ content }}
    </div>
  </div>
</article>
